# Rebuilds the live site once a day so Yelp rating, review count and the
# newest reviews stay current (they are fetched at build time, see src/lib/yelp.ts).
# Needs one repository secret: DEPLOY_HOOK_URL — the build hook from the host
# (Netlify, Vercel or Cloudflare Pages all provide one). YELP_API_KEY lives in
# the host's environment variables, not here.
name: Refresh Yelp data

on:
  schedule:
    - cron: '17 13 * * *' # daily, ~6am Pacific
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "DEPLOY_HOOK_URL not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
